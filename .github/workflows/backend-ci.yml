# ResQNet backend CI — Phase 18.
#
# Runs on every push/PR that touches the backend, and gates the GHCR image
# publish behind ALL of these passing first. Nothing here deploys anywhere —
# see deploy.yml (manually triggered) for that, which itself depends on this
# workflow's image having been published.
name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

# A newer push on the same branch/PR cancels an in-flight run for it —
# avoids wasting CI minutes on superseded commits.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - name: Test
        run: npm test
        env:
          # Dummy values only — this job never touches a real database or
          # real Google/Firebase credentials (every test mocks its own
          # dependencies; see backend/tests/setupEnv.ts for the same
          # pattern used locally). Never real secrets, never printed.
          NODE_ENV: test
          PG_USER: ci_test_user
          PG_PASSWORD: ci_test_password
          PG_DATABASE: ci_test_db
          GOOGLE_OAUTH_CLIENT_ID: ci-test-client-id.apps.googleusercontent.com
          JWT_ACCESS_SECRET: ci-test-access-secret-needs-32-chars-minimum
          JWT_REFRESH_SECRET: ci-test-refresh-secret-needs-32-chars-minimum
          EMPLOYEE_JWT_ACCESS_SECRET: ci-test-employee-access-secret-needs-32-chars
          EMPLOYEE_JWT_REFRESH_SECRET: ci-test-employee-refresh-secret-needs-32-chars
          MINIO_ACCESS_KEY: ci_test_minio_access_key
          MINIO_SECRET_KEY: ci_test_minio_secret_key

      - run: npm run build

      - name: Verify the compiled output actually exists (build didn't silently no-op)
        run: test -f dist/src/server.js

  migration-check:
    name: Migrations apply cleanly to a fresh database
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resqnet_migrate_ci
          POSTGRES_PASSWORD: ci_only_not_a_real_secret
          POSTGRES_DB: resqnet_migrate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resqnet_migrate_ci -d resqnet_migrate_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Apply migrations against a throwaway CI-only Postgres
        run: npm run migrate
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: resqnet_migrate_ci
          PG_PASSWORD: ci_only_not_a_real_secret
          PG_DATABASE: resqnet_migrate_ci
          # Only required so config/env.ts's schema validates — this job
          # never starts the actual server or touches Google/JWT/MinIO.
          GOOGLE_OAUTH_CLIENT_ID: ci-test-client-id.apps.googleusercontent.com
          JWT_ACCESS_SECRET: ci-test-access-secret-needs-32-chars-minimum
          JWT_REFRESH_SECRET: ci-test-refresh-secret-needs-32-chars-minimum
          EMPLOYEE_JWT_ACCESS_SECRET: ci-test-employee-access-secret-needs-32-chars
          EMPLOYEE_JWT_REFRESH_SECRET: ci-test-employee-refresh-secret-needs-32-chars
          MINIO_ACCESS_KEY: ci_test_minio_access_key
          MINIO_SECRET_KEY: ci_test_minio_secret_key
      - name: Re-run migrations a second time (must be a safe no-op — every migration uses IF NOT EXISTS / schema_migrations tracking)
        run: npm run migrate
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: resqnet_migrate_ci
          PG_PASSWORD: ci_only_not_a_real_secret
          PG_DATABASE: resqnet_migrate_ci
          GOOGLE_OAUTH_CLIENT_ID: ci-test-client-id.apps.googleusercontent.com
          JWT_ACCESS_SECRET: ci-test-access-secret-needs-32-chars-minimum
          JWT_REFRESH_SECRET: ci-test-refresh-secret-needs-32-chars-minimum
          EMPLOYEE_JWT_ACCESS_SECRET: ci-test-employee-access-secret-needs-32-chars
          EMPLOYEE_JWT_REFRESH_SECRET: ci-test-employee-refresh-secret-needs-32-chars
          MINIO_ACCESS_KEY: ci_test_minio_access_key
          MINIO_SECRET_KEY: ci_test_minio_secret_key

  docker-build:
    name: Build production Docker image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build image (always — validates the Dockerfile on every push/PR)
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          tags: resqnet-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Publish only on an actual push to main — never from a PR (a PR
      # from a fork could not push anyway; forks don't get repo secrets/
      # GITHUB_TOKEN write access, and this guard keeps that intent
      # explicit rather than relying only on the platform default).
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged ONLY by commit SHA — deliberately no `:latest` tag (a
      # floating tag is exactly what requirement #7 says to avoid for
      # production images). deploy.yml always deploys this exact,
      # immutable SHA tag, never a mutable alias.
      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository }}/resqnet-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
