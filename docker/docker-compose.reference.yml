# ResQNet — reference production compose file.
#
# This is a REFERENCE copy checked into the repo for documentation/review.
# The file actually running on the VPS is host-owned, at
# /opt/resqnet/docker/docker-compose.prod.yml — copy this there and treat
# that copy as the source of truth once it diverges (e.g. real resource
# limits tuned from observed usage).
#
# Isolation from Orbyatravel (or any other project on this shared VPS):
# every name below is resqnet-prefixed, the network is private to this
# compose file, and neither service publishes a port Orbyatravel (or the
# public internet) could reach except the api service's single
# loopback-bound port.
#
# Real secrets live only in .env.prod next to this file (chmod 600,
# never committed) — see docker/.env.prod.example for the variables it
# must define.

services:
  api:
    # Phase 18: deploys the exact image CI built and tested (backend-ci.yml),
    # never rebuilt from source on the host — that's the point of CI/CD
    # (the artifact that passed tests is the artifact that runs). Set
    # RESQNET_API_IMAGE in .env.prod to the full GHCR reference + an
    # immutable commit-SHA tag (never `:latest` — see .env.prod.example).
    # A `build:` section is deliberately NOT restored here even for local
    # testing — use `docker build backend/` directly if you need that.
    image: ${RESQNET_API_IMAGE}
    container_name: resqnet-api
    restart: unless-stopped
    mem_limit: 768m
    ports:
      # Loopback-only. For early VPS-IP testing (no nginx/domain yet —
      # see docs/AUDIT.md), this is deliberately widened to 0.0.0.0 by
      # the operator at deploy time (not by editing this file — see the
      # deployment guide) and narrowed back to 127.0.0.1 once nginx is in
      # front of it.
      - "127.0.0.1:${RESQNET_API_PORT:-3300}:3000"
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - resqnet_internal

  minio:
    # Phase 18: pinned per requirement #7 (no unnecessary `latest` on a
    # production image) — this IS the current, verified tag, but it is
    # also the LAST one that will ever exist: as of this phase,
    # github.com/minio/minio is archived (read-only, "archived by the
    # owner on Apr 25, 2026") and MinIO stopped publishing free
    # pre-built Docker Hub images in October 2025. This tag fixes the
    # final critical CVE (service-account/STS privilege escalation)
    # MinIO shipped before archival — it is the right tag to pin to
    # today, but it will receive no further security updates, ever.
    # This is a real architectural gap Phase 18 surfaced but does NOT
    # resolve (out of scope — "do not invent infrastructure"): before
    # real production data lands in MinIO, a deliberate decision is
    # needed (self-build from the archived source per MinIO's own final
    # release notes, a maintained fork, or replacing MinIO with another
    # S3-compatible provider). Flagged in docs/DONE.md's Phase 18 entry.
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: resqnet-minio
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data
    # No `ports:` — same private-by-default pattern as resqnet-db. Only
    # resqnet-api, on the same private network, can reach it.
    volumes:
      - resqnet_minio_data:/data
    networks:
      - resqnet_internal

  db:
    image: postgres:16-alpine
    container_name: resqnet-db
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # No `ports:` — intentionally not published to the host at all.
    # Only resqnet-api, on the same private network, can reach it.
    volumes:
      - resqnet_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - resqnet_internal

networks:
  resqnet_internal:
    name: resqnet_network

volumes:
  resqnet_db_data:
    name: resqnet_db_data
  resqnet_minio_data:
    name: resqnet_minio_data
