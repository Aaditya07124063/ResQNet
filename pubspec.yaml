name: resqnet
description: AI-powered offline emergency communication platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  nearby_connections: ^4.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  firebase_core: ^2.27.0
  cloud_firestore: ^4.15.0
  firebase_auth: ^4.17.0
  firebase_messaging: ^14.7.19
  flutter_local_notifications: ^17.2.2
  google_sign_in: ^6.2.1
  uuid: ^4.3.3
  intl: ^0.19.0
  permission_handler: ^11.3.0
  pinput: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true