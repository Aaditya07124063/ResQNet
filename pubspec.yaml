name: resqnet
description: ResQNet - AI-powered offline emergency communication for disaster response
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.0
  firebase_auth: ^5.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2
  firebase_storage: ^12.3.2
  google_sign_in: ^6.2.1
  uuid: ^4.3.3
  intl: ^0.19.0
  permission_handler: ^11.3.0
  pinput: ^5.0.0
  nearby_connections: ^4.0.0
  shared_preferences: ^2.2.3
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  translator: ^1.0.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  battery_plus: ^6.0.1
  cached_network_image: ^3.3.1
  pdf: ^3.10.8
  printing: ^5.12.0
  sensors_plus: ^4.0.2
  qr_flutter: ^4.1.0
  flutter_map_tile_caching: ^9.1.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/